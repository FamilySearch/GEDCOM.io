# Rebuilds each GEDZIP test archive (testfiles/**/*.gdz) from the folder beside it
# after a merge, and opens a pull request with the result. Pull requests change the
# folders; only this workflow changes the archives, so test-file pull requests no
# longer conflict over binary files.
---
name: Build GEDZIP archives

on:
  push:
    branches: [main, next-minor, next-patch]
    paths: ['testfiles/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-gdz-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-gdz:
    permissions:
      contents: write  # to push the rebuild branch
      pull-requests: write  # to open its pull request
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout GEDCOM.io
        uses: actions/checkout@v6

      - name: Build GEDZIP archives from their folders
        id: build
        run: |
          rebuilt=$(python3 .github/scripts/build_gdz.py)
          echo "$rebuilt"
          if [ -n "$rebuilt" ]; then echo "status=changes" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update the pull request
        if: steps.build.outputs.status == 'changes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "generate-gdz-$BRANCH"
          git add testfiles
          git commit -m "Rebuild GEDZIP archives from their folders"
          git push -f origin "generate-gdz-$BRANCH"
          if [ -z "$(gh pr list --head "generate-gdz-$BRANCH" --json number --jq '.[].number')" ]; then
            gh pr create -B "$BRANCH" -H "generate-gdz-$BRANCH" --title "Rebuild GEDZIP archives in $BRANCH" --body $'Rebuilds the GEDZIP test archives from their folders after a merge.\nThis PR is auto-generated by build-gdz.yml.' --label 'automated pr'
          fi
